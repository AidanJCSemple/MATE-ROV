# Every tunable property of the simulated ROV. The model is generated from this file at launch,
# so tuning never means editing SDF. Run `ros2 run rov_physics_sim hydrostatics` after a change
# to see the resulting mass, volume, net buoyancy and expected trim.
#
# Frame: base_link, REP-103. x forward, y left, z up, origin at the centre of Mech's envelope.
# Units: SI (kg, m, s).
#
# Status: PLACEHOLDERS. Mech has given only the overall envelope. Mass, centre of mass, inertia
# and the buoyant volumes below are estimates sized so the vehicle floats slightly positive.
# Replace them with Mech's mass-properties report when it arrives.

---
envelope:  # Mech, Nov 2026: 18 x 14.58 x 11 in
  length: 0.4572
  width: 0.3703
  height: 0.2794

mass:
  total: 11.5             # kg. Same placeholder rov_gazebo_sim uses. Includes 6 x ~0.5 kg thrusters.
  center: [0.0, 0.0, -0.03]  # Heavy parts sit low; keep this below the centre of buoyancy.
  # Inertia about the centre of mass. Leave null to estimate it as a solid box filling
  # inertia_fill of the envelope, which is reasonable for a dense, compact frame.
  inertia: null           # or {ixx: , iyy: , izz: , ixy: 0, ixz: 0, iyz: 0}
  inertia_fill: 0.8

water:
  density: 1000.0         # kg/m^3, fresh water (pool)

# Buoyant volumes. Gazebo computes buoyancy from collision geometry, and its graded (surface)
# mode only handles boxes and spheres, so every volume here is a box. Each box's volume is the
# water that part displaces: a sealed tube counts in full, an open frame only its material.
# Boxes must not overlap, or the overlap would be counted twice (the unit tests check this).
# They double as contact geometry against the pool walls.
volumes:
  # Open frame: 12 rails, 20 mm square, along the edges of the envelope.
  - {name: rail_x_lt, size: [0.4572, 0.02, 0.02], pos: [0.0, 0.1751, 0.1297]}
  - {name: rail_x_rt, size: [0.4572, 0.02, 0.02], pos: [0.0, -0.1751, 0.1297]}
  - {name: rail_x_lb, size: [0.4572, 0.02, 0.02], pos: [0.0, 0.1751, -0.1297]}
  - {name: rail_x_rb, size: [0.4572, 0.02, 0.02], pos: [0.0, -0.1751, -0.1297]}
  - {name: rail_y_ft, size: [0.02, 0.330, 0.02], pos: [0.2186, 0.0, 0.1297]}
  - {name: rail_y_bt, size: [0.02, 0.330, 0.02], pos: [-0.2186, 0.0, 0.1297]}
  - {name: rail_y_fb, size: [0.02, 0.330, 0.02], pos: [0.2186, 0.0, -0.1297]}
  - {name: rail_y_bb, size: [0.02, 0.330, 0.02], pos: [-0.2186, 0.0, -0.1297]}
  - {name: rail_z_fl, size: [0.02, 0.02, 0.2394], pos: [0.2186, 0.1751, 0.0]}
  - {name: rail_z_fr, size: [0.02, 0.02, 0.2394], pos: [0.2186, -0.1751, 0.0]}
  - {name: rail_z_bl, size: [0.02, 0.02, 0.2394], pos: [-0.2186, 0.1751, 0.0]}
  - {name: rail_z_br, size: [0.02, 0.02, 0.2394], pos: [-0.2186, -0.1751, 0.0]}
  # Sealed electronics tube along x, as a box of the same volume (~4 in OD x 300 mm).
  - {name: electronics_tube, size: [0.30, 0.101, 0.101], pos: [0.0, 0.0, 0.0]}
  # Thruster bodies. Corner thrusters are vectored at 45 deg in the CAD; boxes stay axis-aligned
  # because only their volume and centre matter for buoyancy.
  - {name: thruster_fl, size: [0.07, 0.06, 0.06], pos: [0.17, 0.13, -0.05]}
  - {name: thruster_fr, size: [0.07, 0.06, 0.06], pos: [0.17, -0.13, -0.05]}
  - {name: thruster_bl, size: [0.07, 0.06, 0.06], pos: [-0.17, 0.13, -0.05]}
  - {name: thruster_br, size: [0.07, 0.06, 0.06], pos: [-0.17, -0.13, -0.05]}
  - {name: thruster_vl, size: [0.06, 0.06, 0.06], pos: [0.0, 0.10, 0.03]}
  - {name: thruster_vr, size: [0.06, 0.06, 0.06], pos: [0.0, -0.10, 0.03]}
  # Flotation blocks on top. Sized last, so the total is ~2 % positively buoyant.
  - {name: float_left, size: [0.40, 0.12, 0.058], pos: [0.0, 0.105, 0.1107]}
  - {name: float_right, size: [0.40, 0.12, 0.058], pos: [0.0, -0.105, 0.1107]}

# Temporary damping so the robot settles in M1. Gazebo's Hydrodynamics system (Fossen).
# Values are BlueROV2 bring-up numbers (orca4); tune in M2/M4. Negative by convention.
hydrodynamics:
  linear: {xU: -4.03, yV: -6.22, zW: -5.18, kP: -0.07, mQ: -0.07, nR: -0.07}
  quadratic: {xUabsU: -18.18, yVabsV: -21.66, zWabsW: -36.99, kPabsP: -1.55, mQabsQ: -1.55, nRabsR: -1.55}
  added_mass: {}          # M2. e.g. xDotU, yDotV, zDotW, kDotP, mDotQ, nDotR

visual:
  mesh: meshes/rov_visual.stl  # ROV_General_CAD.stl, tether removed, ~4.5k faces, metres, base_link axes
  # The STL measures 0.24 x 0.23 x 0.135 m, about half of Mech's envelope. Until that is resolved
  # the mesh is shown at its own size; set scale to stretch it.
  scale: [1.0, 1.0, 1.0]

# Thruster mounts measured from the STL (in its scale, base_link axes). Not used until M2.
# Directions are the thruster shaft axis; sign (which way it pushes) is still TBD with Mech.
thrusters_from_cad:
  - {name: t_fl, pos: [0.074, 0.083, -0.012], axis: [0.71, -0.71, 0.0]}
  - {name: t_fr, pos: [0.078, -0.094, -0.012], axis: [0.71, 0.71, 0.0]}
  - {name: t_bl, pos: [-0.099, 0.086, -0.012], axis: [0.71, 0.71, 0.0]}
  - {name: t_br, pos: [-0.101, -0.091, -0.012], axis: [0.71, -0.71, 0.0]}
  - {name: t_vl, pos: [-0.011, 0.038, 0.041], axis: [0.0, 0.0, 1.0]}
  - {name: t_vr, pos: [-0.013, -0.049, 0.041], axis: [0.0, 0.0, 1.0]}
